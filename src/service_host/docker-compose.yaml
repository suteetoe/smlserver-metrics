services:
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: always
    privileged: true
    command:
      - --docker_only=true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks: ["sml_service_network"]
  node_exporter:
    image: prom/node-exporter:v1.9.1
    container_name: node_exporter
    restart: always
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    expose:
      - 9100
    networks: ["sml_service_network"]
  alloy:
    image: grafana/alloy:v1.12.1
    container_name: alloy
    restart: always
    ports:
      - "12345:12345"
    privileged: true
    user: root
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    volumes:
      - ./conf/config.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock
    devices:
      - /dev/kmsg
    depends_on:
      - cadvisor
      - node_exporter
      - traefik
    networks: ["sml_service_network"]
  postgresql:
    image: postgres:18.4
    container_name: sml_postgresql
    restart: always
    shm_size: 1g
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
       - "5432:5432"
    volumes:
      - ./postgresql:/var/lib/postgresql
    networks: ["sml_service_network"]
  postgres_exporter:
    image: wrouesnel/postgres_exporter:latest
    container_name: sml_postgres_exporter
    restart: always
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USERNAME}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/postgres?sslmode=disable
    ports:
      - "9187:9187"
    networks: ["sml_service_network"]
    depends_on:
      - postgresql
  smljavawebservice:
    image: ghcr.io/smlsoft/smljavawebservice:3.9.14-jdk11
    restart: always
    container_name: sml_webservice
    ports:
      - "8081:8081"
    expose:
      - 8080
    volumes:
      - ./tomcat_temp:/usr/local/tomcat/temp
      - ./conf:/opt/monitoring
    environment:
        - "CATALINA_OPTS=-javaagent:/opt/monitoring/jmx_prometheus_javaagent-1.5.0.jar=8081:/opt/monitoring/jmx-config.yaml"
    labels:
      - "traefik.http.routers.smljavawebservice.rule=(PathPrefix(`/SMLJavaWebService`))"
      - "autoheal=true"
    healthcheck:
      test: ["CMD-SHELL", "(command -v curl >/dev/null 2>&1 && curl -fsS http://localhost:8080/SMLJavaWebService/health >/dev/null) || (command -v wget >/dev/null 2>&1 && wget -qO- http://localhost:8080/SMLJavaWebService/health >/dev/null)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks: ["sml_service_network"]
  autoheal:
    image: willfarrell/autoheal:1.2.0
    container_name: autoheal
    restart: always
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 30
      AUTOHEAL_START_PERIOD: 120
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: ["sml_service_network"]
  traefik:
    image: traefik:v3.6
    restart: always
    container_name: traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.watch"
      - "--entrypoints.web.address=:80"
      # - "--providers.docker.exposedbydefault=false"
      - "--api.dashboard=true"
      # - "--log.level=DEBUG"
      # Enable Prometheus metrics endpoint
      - "--entrypoints.metrics.address=:9091"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.entrypoint=metrics"
    labels:
      - "traefik.http.routers.api.rule=((PathPrefix(`/api`) || PathPrefix(`/dashboard`)))"
      - "traefik.http.routers.api.service=api@internal"
      - "traefik.http.routers.api.middlewares=auth"
      - "traefik.http.middlewares.auth.basicauth.users=toe:$$apr1$$9dmswe8v$$k1RQ.WAI57gWWHD.l/.dV1,sml:$$apr1$$ia38r5sb$$8uxrh4fGN.OOFjdhB9FNW0"
      # - "traefik.http.middlewares.auth.basicauth.removeheader=true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - 80:80
      - 8080:8080
      - 9091:9091
    networks: ["sml_service_network"]

networks:
  sml_service_network:
    name: sml_service_network
    external: true
